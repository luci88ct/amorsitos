<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17111f">
  <title>Amorsitos 🐷🐰</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --fondo: #17111f;
      --tarjeta: #241a2e;
      --texto: #fff8ff;
      --apagado: #cfc2d5;
      --rosa: #f08cab;
      --rosa-oscuro: #c95f82;
      --azul: #79b9ff;
      --verde: #65c990;
      --rojo: #ef6e7b;
      --borde: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(240, 140, 171, 0.18), transparent 35%),
        radial-gradient(circle at right bottom, rgba(121, 185, 255, 0.12), transparent 30%),
        var(--fondo);
      color: var(--texto);
    }

    main {
      width: min(100% - 32px, 680px);
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3rem);
      text-align: center;
    }

    .subtitulo {
      margin: 8px 0 26px;
      text-align: center;
      color: var(--apagado);
    }

    .tarjeta {
      padding: 18px;
      margin-top: 16px;
      border: 1px solid var(--borde);
      border-radius: 20px;
      background: rgba(36, 26, 46, 0.94);
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.2);
    }

    h2 {
      margin: 0 0 14px;
      font-size: 1.12rem;
    }

    .nombre-fila {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--borde);
      border-radius: 12px;
      background: #15101c;
      color: var(--texto);
      font: inherit;
    }

    button {
      min-height: 52px;
      padding: 12px 16px;
      border: 0;
      border-radius: 14px;
      background: var(--rosa);
      color: #2b1020;
      font: inherit;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    button:hover {
      filter: brightness(1.08);
    }

    .botones {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .boton-fumar {
      min-height: 78px;
      background: var(--rojo);
      color: #2a0810;
      font-size: 1.25rem;
    }

    .boton-deporte {
      background: var(--verde);
      color: #082515;
    }

    .contador-total-boton {
  min-height: 52px;
  padding: 10px 12px;
  border: 1px solid rgba(121, 185, 255, 0.35);
  border-radius: 14px;
  background: rgba(121, 185, 255, 0.14);
  color: var(--texto);
  text-align: center;
}

.contador-total-boton span,
.contador-total-boton small {
  display: block;
  color: var(--apagado);
  font-size: 0.78rem;
}

.contador-total-boton strong {
  display: block;
  margin: 1px 0;
  color: var(--azul);
  font-size: 1.7rem;
}

    .estado {
      min-height: 23px;
      margin: 12px 0 0;
      color: var(--apagado);
      text-align: center;
    }

    .estado.error {
      color: #ffabb3;
    }

    .contador {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 0 0 14px;
    }

    .contador strong {
      color: var(--rosa);
      font-size: 2.3rem;
    }

    .contador span {
      color: var(--apagado);
    }

    .lista {
      display: grid;
      gap: 10px;
    }

    .registro {
      padding: 13px;
      border: 1px solid var(--borde);
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.16);
    }

    .registro-principal {
      font-weight: 750;
    }

    .registro-hora {
      margin-top: 5px;
      color: var(--apagado);
      font-size: 0.88rem;
    }

    .vacio {
      margin: 0;
      color: var(--apagado);
      text-align: center;
    }

    .nota {
      margin: 15px 0 0;
      color: var(--apagado);
      font-size: 0.85rem;
      text-align: center;
    }

    @media (min-width: 560px) {
      .botones {
        grid-template-columns: repeat(3, 1fr);
      }

      .boton-fumar {
        grid-column: span 3;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Amorsitos 🐷🐰</h1>
    <p class="subtitulo">Registro compartido de objetivos</p>

    <section class="tarjeta">
      <h2>¿Quién registra la actividad?</h2>

      <div class="nombre-fila">
        <input
          id="usuario"
          type="text"
          maxlength="40"
          placeholder="Tu nombre"
          autocomplete="name"
        >
        <button type="button" onclick="guardarNombre()">Guardar</button>
      </div>
    </section>

    <section class="tarjeta">
      <h2>Registrar ahora</h2>

      <div class="botones">
        <button class="boton-fumar" type="button" onclick="registrar('He fumado un cigarro')">
          🚬 He fumado un cigarro
        </button>

        <button class="boton-deporte" type="button" onclick="registrar('He hecho deporte')">
          💪 He hecho deporte
        </button>

        <div class="contador-total-boton">
          <span>Total acumulado</span>
          <strong id="contadorFumarTotal">0</strong>
          <small>cigarros registrados</small>
        </div>
      </div>

      <p id="estado" class="estado"></p>
    </section>

    <section class="tarjeta">
      <h2>Cigarros de hoy</h2>
      <p class="contador">
        <strong id="contadorFumar">0</strong>
        <span>registrados hoy</span>
      </p>
    </section>

    <section class="tarjeta">
      <h2>Últimos registros</h2>
      <div id="listaRegistros" class="lista">
        <p class="vacio">Cargando registros…</p>
      </div>
    </section>

    <p class="nota">
      La fecha y hora se guardan automáticamente en Supabase.
    </p>
  </main>

  <script>
    // PEGA AQUÍ los dos datos que has guardado de Supabase.
    const SUPABASE_URL = 'https://zdnodsycijifoltclpxx.supabase.co/';
    const SUPABASE_KEY = 'sb_publishable_Xi2QJVrNMWOdMJlF00oZdA_aV0e7jRF';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const inputUsuario = document.getElementById('usuario');
    const estado = document.getElementById('estado');
    const listaRegistros = document.getElementById('listaRegistros');
    const contadorFumar = document.getElementById('contadorFumar');
    const contadorFumarTotal = document.getElementById('contadorFumarTotal');

    inputUsuario.value = localStorage.getItem('amorsitos_usuario') || '';

    function guardarNombre() {
      const nombre = inputUsuario.value.trim();

      if (!nombre) {
        mostrarEstado('Escribe primero tu nombre.', true);
        inputUsuario.focus();
        return;
      }

      localStorage.setItem('amorsitos_usuario', nombre);
      mostrarEstado('Nombre guardado en este dispositivo.');
    }

    function obtenerUsuario() {
      const nombre = inputUsuario.value.trim();

      if (!nombre) {
        mostrarEstado('Escribe y guarda tu nombre antes de registrar una actividad.', true);
        inputUsuario.focus();
        return null;
      }

      localStorage.setItem('amorsitos_usuario', nombre);
      return nombre;
    }

    function mostrarEstado(mensaje, esError = false) {
      estado.textContent = mensaje;
      estado.classList.toggle('error', esError);

      if (mensaje) {
        setTimeout(() => {
          if (estado.textContent === mensaje) {
            estado.textContent = '';
            estado.classList.remove('error');
          }
        }, 4000);
      }
    }

    async function registrar(actividad) {
      const usuario = obtenerUsuario();

      if (!usuario) return;

      mostrarEstado('Guardando…');

      const { error } = await db
        .from('registros')
        .insert({
          usuario: usuario,
          actividad: actividad,
          cantidad: 1,
          nota: null
        });

      if (error) {
        console.error(error);
        mostrarEstado('No se pudo guardar: ' + error.message, true);
        return;
      }

      mostrarEstado('✓ Registrado correctamente.');
      await cargarRegistros();
    }

    function formatoFechaHora(fecha) {
      return new Intl.DateTimeFormat('es-ES', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false,
        timeZone: 'Europe/Madrid'
      }).format(new Date(fecha));
    }

    function inicioDeHoyMadrid() {
      const ahora = new Date();

      const partes = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Europe/Madrid',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).formatToParts(ahora);

      const valores = Object.fromEntries(
        partes
          .filter(parte => parte.type !== 'literal')
          .map(parte => [parte.type, parte.value])
      );

      return `${valores.year}-${valores.month}-${valores.day}T00:00:00+02:00`;
    }

    async function cargarRegistros() {
      const { data, error } = await db
        .from('registros')
        .select('*')
        .order('fecha_hora', { ascending: false })
        .limit(30);

      if (error) {
        console.error(error);
        listaRegistros.innerHTML = '<p class="vacio">No se pudieron cargar los registros.</p>';
        return;
      }

      const registros = data || [];

      if (!registros.length) {
        listaRegistros.innerHTML = '<p class="vacio">Todavía no hay registros.</p>';
      } else {
        listaRegistros.innerHTML = registros.map(registro => `
          <article class="registro">
            <div class="registro-principal">
              ${escaparHTML(registro.usuario)} — ${escaparHTML(registro.actividad)}
            </div>
            <div class="registro-hora">
              ${formatoFechaHora(registro.fecha_hora)}
            </div>
          </article>
        `).join('');
      }

      const inicioHoy = inicioDeHoyMadrid();
      const cigarrosHoy = registros.filter(registro =>
        registro.actividad === 'He fumado un cigarro' &&
        registro.fecha_hora >= inicioHoy
      ).reduce((total, registro) => total + (registro.cantidad || 1), 0);

      contadorFumar.textContent = cigarrosHoy;
      const cigarrosTotal = registros
        .filter(registro => registro.actividad === 'He fumado un cigarro')
        .reduce((total, registro) => total + (registro.cantidad || 1), 0);

      contadorFumarTotal.textContent = cigarrosTotal;
    }

    function escaparHTML(texto) {
      const elemento = document.createElement('div');
      elemento.textContent = texto || '';
      return elemento.innerHTML;
    }

    cargarRegistros();

    setInterval(cargarRegistros, 15000);
  </script>
</body>
</html>
